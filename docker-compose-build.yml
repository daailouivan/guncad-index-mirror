services:
  guncad-mirror:
    build: .
    env_file: guncad-mirror.env
    environment:
      MIRROR_API_ENDPOINT: "${MIRROR_SMOKE_API_ENDPOINT:?contrib/test-docker.sh must set a narrow API query}"
      MIRROR_API_MAX_PAGES: "${MIRROR_API_MAX_PAGES:-2}"
      MIRROR_ENABLE_WEBUI: "false"
      MIRROR_MAX_RELEASES_PER_RUN: "${MIRROR_SMOKE_RELEASES:-1}"
      MIRROR_MIN_FREE_SPACE: "${MIRROR_MIN_FREE_SPACE:-1073741824}"
    command:
      - "-v"
      - "--once"
    volumes:
      - guncad-mirror-smoke:/data:Z
    healthcheck:
      test: |
        curl -f http://127.0.0.1:5279 -X POST -d '{"method": "status"}' | grep -ie '^.*is_running.*true.*$' || exit 1
      start_period: 300s
      interval: 5s
      timeout: 15s
      retries: 12

volumes:
  guncad-mirror-smoke:
