[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["guncadmirror"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["guncadmirror"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
exclude = "venv"
profile = "jinja"
use_gitignore = true
