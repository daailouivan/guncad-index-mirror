image: ubuntu:latest
stages:
  - Setup
  - Lint
  - Build
  - Test
  - Release
  - GitLab
before_script:
  - apt-get update && apt-get install -y python3 python3-venv
variables:
  REGISTRY: registry.gitlab.com/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TARBALL: container-$CI_COMMIT_SHORT_SHA.tar
  IMAGE_TAG: $REGISTRY:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_RELEASE: $REGISTRY:$CI_COMMIT_TAG
  IMAGE_TAG_BLEEDING: $REGISTRY:bleeding
  IMAGE_TAG_LATEST: $REGISTRY:latest
default:
  interruptible: yes
  retry: 2
  services:
    - name: docker:dind
      alias: docker
      command: [ "--tls=false" ]
  cache:
    - key: cache-venv-$CI_COMMIT_REF_SLUG
      paths:
        - venv

# Environment setup
# Kind of nasty. Really we should have our own container for this
Setup:
  stage: Setup
  script:
    - python3 -m venv venv
    - . venv/bin/activate
    - pip3 install --upgrade pip
    - pip3 install --upgrade -r requirements.txt -r requirements-build.txt

# Linting and preprocessing
# All of these should be required for PRs and run on all branches
Black:
  stage: Lint
  script:
    - python3 -m venv venv
    - . venv/bin/activate
    - pip3 install --upgrade pip
    - pip3 install --upgrade -r requirements.txt -r requirements-build.txt
    - python3 -m black --check .
isort:
  stage: Lint
  script:
    - python3 -m venv venv
    - . venv/bin/activate
    - python3 -m isort --profile black --check-only .

# Building
Build Container:
  image: docker:latest
  cache: []
  before_script: []
  stage: Build
  script:
    - docker --version
    - docker pull "$IMAGE_TAG_BLEEDING" || true
    - docker images
    - docker build --build-arg commit_sha=$CI_COMMIT_SHORT_SHA --build-arg commit_tag=$CI_COMMIT_TAG -t $IMAGE_TAG .
    - docker images
    - docker save $IMAGE_TAG > $IMAGE_TARBALL
  artifacts:
    paths:
      - $IMAGE_TARBALL
    expire_in: 1h

# Tagging
Tag SHA:
  image: docker:latest
  interruptible: no
  cache: []
  before_script: []
  stage: Release
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker load -i $IMAGE_TARBALL
    - docker images
    - docker tag "$IMAGE_TAG" "$IMAGE_TAG_BLEEDING"
    - docker images
    - docker push $IMAGE_TAG
    - docker push "$IMAGE_TAG_BLEEDING"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
Tag Release:
  image: docker:latest
  interruptible: no
  cache: []
  before_script: []
  stage: Release
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker load -i $IMAGE_TARBALL
    - docker images
    - docker tag "$IMAGE_TAG" "$IMAGE_TAG_RELEASE"
    - docker tag "$IMAGE_TAG" "$IMAGE_TAG_LATEST"
    - docker images
    - docker push "$IMAGE_TAG_RELEASE"
    - docker push "$IMAGE_TAG_LATEST"
  rules:
    - if: $CI_COMMIT_TAG
Release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: no
  cache: []
  before_script: []
  stage: GitLab
  script:
    - echo "Running release job..."
  rules:
    - if: $CI_COMMIT_TAG
  release:
    tag_name: $CI_COMMIT_TAG
    name: "GunCAD Index - $CI_COMMIT_TAG"
    description: $CI_COMMIT_TAG_MESSAGE
