---
image: python:3.14-slim
stages:
  - Scan Early
  - Test
  - Build
  - Scan
  - Release
  - GitLab
variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  REGISTRY: registry.gitlab.com/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TARBALL: container-$CI_COMMIT_SHORT_SHA.tar
  QBITTORRENT_IMAGE_TARBALL: qbittorrent-container-$CI_COMMIT_SHORT_SHA.tar
  IMAGE_TAG: $REGISTRY:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_RELEASE: $REGISTRY:$CI_COMMIT_TAG
  IMAGE_TAG_BLEEDING: $REGISTRY:bleeding
  IMAGE_TAG_LATEST: $REGISTRY:latest
default:
  interruptible: true
  retry: 2
  cache:
    - key: pip-$CI_COMMIT_REF_SLUG
      paths:
        - .cache/pip
    - key: trivy-db
      paths:
        - .trivy
.python-job:
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt -r requirements-build.txt
Trivy Secrets:
  image:
    name: ghcr.io/aquasecurity/trivy:0.69.3
    entrypoint: [""]
  stage: Scan Early
  retry: 0
  script:
    - trivy fs --exit-code 1 ./
Trivy Misconfiguration:
  image:
    name: ghcr.io/aquasecurity/trivy:0.69.3
    entrypoint: [""]
  stage: Scan Early
  retry: 0
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 ./
Ruff:
  extends: .python-job
  stage: Test
  script:
    - python -m ruff check .
    - python -m ruff format --check .
djLint:
  extends: .python-job
  stage: Test
  script:
    - djlint guncadmirror/templates --check
ShellCheck:
  image:
    name: koalaman/shellcheck-alpine:stable
    entrypoint: [""]
  stage: Test
  before_script: []
  script:
    - shellcheck contrib/*.sh start.sh
YAML Lint:
  image:
    name: ghcr.io/google/yamlfmt:latest
    entrypoint: [""]
  stage: Test
  cache: []
  before_script:
    - apk add git
  script:
    - yamlfmt
    - git diff --exit-code
Unit Tests:
  extends: .python-job
  stage: Test
  script:
    - python -W error::ResourceWarning -m coverage run -m unittest discover -v
    - python -m coverage report --show-missing --skip-covered --fail-under=95
    - python -m coverage xml
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
Build Container:
  image: docker:latest
  stage: Build
  cache: []
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
  before_script: []
  script:
    - docker --version
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER"
      --password-stdin
    - docker buildx create --use
    - docker buildx inspect --bootstrap
    # The patched legacy lbrynet build is currently amd64-only.
    - docker buildx build --platform linux/amd64 --build-arg commit_sha=$CI_COMMIT_SHORT_SHA
      --build-arg commit_tag=$CI_COMMIT_TAG --tag=$IMAGE_TAG --output type=oci,dest=$IMAGE_TARBALL
      .
    - docker buildx build --platform linux/amd64 --file Dockerfile.qbittorrent --output
      type=oci,dest=$QBITTORRENT_IMAGE_TARBALL .
  artifacts:
    paths:
      - $IMAGE_TARBALL
      - $QBITTORRENT_IMAGE_TARBALL
    expire_in: 1h
Scan Container:
  image:
    name: ghcr.io/aquasecurity/trivy:0.69.3
    entrypoint: [""]
  stage: Scan
  allow_failure: true
  retry: 0
  before_script:
    - mkdir container
    - tar xf $IMAGE_TARBALL -C container
  script:
    - trivy image --input container --platform linux/amd64 --scanners vuln,secret,misconfig
      --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
Scan qBittorrent Container:
  image:
    name: ghcr.io/aquasecurity/trivy:0.69.3
    entrypoint: [""]
  stage: Scan
  allow_failure: true
  retry: 0
  before_script:
    - mkdir qbittorrent-container
    - tar xf $QBITTORRENT_IMAGE_TARBALL -C qbittorrent-container
  script:
    - trivy image --input qbittorrent-container --platform linux/amd64 --scanners
      vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
Publish SHA:
  image:
    name: quay.io/containers/skopeo:latest
    entrypoint: [""]
  stage: Release
  interruptible: false
  cache: []
  before_script: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | skopeo login "$CI_REGISTRY" -u "$CI_REGISTRY_USER"
      --password-stdin
    - skopeo inspect oci-archive:$IMAGE_TARBALL
    - skopeo copy --all oci-archive:$IMAGE_TARBALL docker://$IMAGE_TAG
    - skopeo copy --all oci-archive:$IMAGE_TARBALL docker://$IMAGE_TAG_BLEEDING
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
Publish Release:
  image:
    name: quay.io/containers/skopeo:latest
    entrypoint: [""]
  stage: Release
  interruptible: false
  cache: []
  before_script: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | skopeo login "$CI_REGISTRY" -u "$CI_REGISTRY_USER"
      --password-stdin
    - skopeo inspect oci-archive:$IMAGE_TARBALL
    - skopeo copy --all oci-archive:$IMAGE_TARBALL docker://$IMAGE_TAG_RELEASE
    - skopeo copy --all oci-archive:$IMAGE_TARBALL docker://$IMAGE_TAG_LATEST
  rules:
    - if: $CI_COMMIT_TAG
Release Notes:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: GitLab
  interruptible: false
  cache: []
  before_script: []
  script:
    - echo "Running release job"
  rules:
    - if: $CI_COMMIT_TAG
  release:
    tag_name: $CI_COMMIT_TAG
    name: "GunCAD Mirror - $CI_COMMIT_TAG"
    description: $CI_COMMIT_TAG_MESSAGE
